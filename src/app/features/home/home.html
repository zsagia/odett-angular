<div class="home-container">
  <div class="home-card">
    <h1>Welcome!</h1>

    @if (user()) {
      <p class="user-info">
        Bejelentkezve: <strong>{{ user()?.name }}</strong>
        <span class="role-badge">{{ user()?.role }}</span>
      </p>
    }

    <nav class="nav-links">
      <a routerLink="/products">Termekek</a>
    </nav>

    <button class="logout-btn" (click)="logout()">Kijelentkezes</button>
  </div>
</div>
