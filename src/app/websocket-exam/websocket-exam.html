<div class="exam-container">
  <h2>WebSocket Vizsga</h2>

  <button
    type="button"
    [disabled]="isConnected()"
    (click)="connect()">
    Kapcsolódás
  </button>

  <div class="log-container">
    <h3>Napló:</h3>
    <ul>
      @for (log of logs(); track log) {
        <li>{{ log }}</li>
      }
    </ul>
  </div>
</div>
